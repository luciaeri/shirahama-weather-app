<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旧南紀白浜空港 天気予報アプリ</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>旧南紀白浜空港 天気予報</h1>
    </header>
    <section class="weather-info">
      <canvas id="weatherCanvas"></canvas>
    </section>
    <section class="forecast-chart">
      <canvas id="forecastChart"></canvas>
    </section>
    <section class="runway-visualizer">
      <canvas id="runwayCanvas"></canvas>
    </section>
  </div>
  <script src="canvas-weather.js"></script>
  <script src="runway-visualizer.js"></script>
  <script src="app.js"></script>
</body>
</html>
